[package]
name = "keylume"
version = "0.5.1"
description = "Independent lighting controller for Launchkey MK4 61"
edition = "2021"
rust-version = "1.88"

[lib]
name = "keylume_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = ["desktop"]
desktop = ["dep:reqwest", "dep:tauri", "dep:tauri-plugin-autostart", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener", "dep:midir", "dep:sysinfo", "dep:cpal", "dep:rustfft", "dep:windows-sys"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
semver = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"], optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
midir = { version = "0.10", optional = true }
sysinfo = { version = "0.37", optional = true }
cpal = { version = "0.15", optional = true }
rustfft = { version = "6", optional = true }
rustysynth = "=1.3.6"
sha2 = "0.10"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "native-tls-no-alpn"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_Networking_WinHttp", "Win32_Foundation", "Win32_System_Services", "Win32_System_SystemInformation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_RemoteDesktop", "Win32_System_Power"] }
