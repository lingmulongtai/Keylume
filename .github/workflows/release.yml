name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    uses: ./.github/workflows/windows.yml
  publish:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: keylume-windows
          path: release-assets
      - name: Publish verified preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test -f "docs/releases/$GITHUB_REF_NAME.md"
          gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag \
            --title "Keylume $GITHUB_REF_NAME Preview" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" --prerelease
